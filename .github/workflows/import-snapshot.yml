name: Import verified MVP snapshot
on:
  push:
    branches: [main]
    paths: [karishmaV2-snapshot.zip]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify and import clean source
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' '5f40001b4c3e82fe06ee1ea752ffb152ec57ae025d8bedd66e6170f8aa9751e8' 'karishmaV2-snapshot.zip' | sha256sum -c -
          unzip -q karishmaV2-snapshot.zip -d /tmp/verified-mvp
          test -f /tmp/verified-mvp/karishmaV2/package-lock.json
          test ! -e /tmp/verified-mvp/karishmaV2/.git
          test ! -e /tmp/verified-mvp/karishmaV2/.env
          cp -a /tmp/verified-mvp/karishmaV2/. .
          rm karishmaV2-snapshot.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Import essential original-UI MVP with working chat and memory adapters'
          git push
