name: Apply verified Google sign-in update
on:
  push:
    paths: ['.github/workflows/apply-google-auth.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply and test source changes
        env:
          PATCH: 
        run: |
          printf '%s' "$PATCH" | base64 --decode > /tmp/google-auth.patch
          git apply --check /tmp/google-auth.patch
          git apply /tmp/google-auth.patch
          npm ci --ignore-scripts
          npm run check
          npm run build
          npm test
          rm .github/workflows/apply-google-auth.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Enable verified Google sign-in with persistent HttpOnly sessions"
          git push
